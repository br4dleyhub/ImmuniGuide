<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}ImmuniGuide{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="nav-container">

            <a href="{{ url_for('home') }}" class="logo">
                ImmuniGuide
            </a>

        <div class="nav-links">

            <a href="{{ url_for('explore') }}">Explore</a>

            <a href="{{ url_for('compare') }}">Compare</a>

            <a href="{{ url_for('trends') }}">Trends</a>

            <a href="{{ url_for('insights') }}">Insights</a>

        </div>

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer>

        <p>
            ImmuniGuide — Understanding immunisation data.
        </p>

    </footer>

</body>

</html>
